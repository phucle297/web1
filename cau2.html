<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>23880259 - Le Dam Duy Phuc</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-white shadow-sm">
    <div class="max-w-5xl mx-auto px-4 flex items-center h-14">
      <a href="cau1.html" class="flex items-center gap-2 font-bold text-lg mr-auto text-gray-900">
        <i class="bi bi-mortarboard-fill text-blue-600"></i>
        All Courses
      </a>
      <div class="flex items-center">
        <a href="cau1.html"
           class="px-3 py-2 text-sm text-gray-800 hover:text-blue-600">Cau 1</a>
        <a href="cau2.html"
           class="px-3 py-2 text-sm font-bold text-blue-600 border-b-2 border-blue-600">Cau 2</a>
        <a id="openModalBtn" href="#"
           class="px-3 py-2 text-sm text-gray-800 hover:text-blue-600">Cau 3</a>
      </div>
    </div>
  </nav>

  <!-- Course list + pagination (rendered by Handlebars) -->
  <div class="max-w-5xl mx-auto px-4 py-6">
    <div id="course-list"></div>
    <div id="pagination-area"></div>
  </div>

  <!-- Modal overlay (hidden by default) -->
  <div id="createCourseModal"
       class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
    <div class="bg-white rounded-lg w-full max-w-md shadow-xl max-h-[90vh] overflow-y-auto">
      <form id="createCourseForm">

        <div class="px-6 pt-6 pb-0">
          <h5 class="font-bold text-lg flex items-center gap-2 mb-4">
            <i class="bi bi-plus-circle-fill text-blue-600"></i>
            Create New Course
          </h5>
          <hr>
        </div>

        <div class="px-6 py-4 space-y-4">

          <div>
            <label for="courseTitle" class="block text-sm font-medium text-gray-700 mb-1">
              Course title <span class="text-red-500">*</span>
            </label>
            <input type="text" id="courseTitle" required
              class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <div>
            <label for="courseDesc" class="block text-sm font-medium text-gray-700 mb-1">
              Course Description <span class="text-red-500">*</span>
            </label>
            <textarea id="courseDesc" rows="3" maxlength="50" required
              class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
          </div>

          <div>
            <label for="courseImage" class="block text-sm font-medium text-gray-700 mb-1">
              Course Image URL <span class="text-red-500">*</span>
            </label>
            <input type="url" id="courseImage" placeholder="https://example.com/image.jpg" required
              class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <div>
            <label for="courseLevel" class="block text-sm font-medium text-gray-700 mb-1">
              Level <span class="text-red-500">*</span>
            </label>
            <select id="courseLevel" required
              class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
              <option value="">--Select level--</option>
              <option value="beginner">Beginner</option>
              <option value="all_levels">All Levels</option>
            </select>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label for="coursePrice" class="block text-sm font-medium text-gray-700 mb-1">
                Price (VND) <span class="text-red-500">*</span>
              </label>
              <input type="number" id="coursePrice" min="0" step="1000" value="0" required
                class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label for="courseLectures" class="block text-sm font-medium text-gray-700 mb-1">
                Total lectures <span class="text-red-500">*</span>
              </label>
              <input type="number" id="courseLectures" min="1" step="1" value="1" required
                class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>

          <div class="flex items-center gap-2">
            <input type="checkbox" id="courseBestseller"
              class="h-4 w-4 rounded border-gray-300 text-blue-600">
            <label for="courseBestseller" class="text-sm text-gray-900">Mark as bestseller</label>
          </div>

        </div>

        <div class="px-6 pb-6 flex justify-end gap-3">
          <button type="button" id="closeModalBtn"
            class="flex items-center gap-1 bg-gray-200 text-gray-700 px-4 py-2 rounded text-sm font-medium hover:bg-gray-300 cursor-pointer">
            <i class="bi bi-x-circle"></i> Close
          </button>
          <button type="submit"
            class="flex items-center gap-1 bg-blue-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-blue-700 cursor-pointer">
            <i class="bi bi-floppy2"></i> Create Course
          </button>
        </div>

      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="text-center text-gray-500 mt-8">
    <p>23880259 - Le Dam Duy Phuc - 23880259@student.hcmus.edu.vn</p>
    <p>
      Link:
      <a
        href="https://phucle297.github.io/web1/"
        rel="noopener noreferrer"
        target="_blank"
        >https://phucle297.github.io/web1</a
      >
    </p>
    <p>Description: Finish all tasks.</p>
  </footer>


  <!-- Handlebars template: course cards -->
  <script id="tpl-courses" type="text/x-handlebars-template">
    {{#each courses}}
    <div class="bg-white rounded-lg shadow overflow-hidden flex mb-4">
      <div class="grow p-4">
        <h2 class="font-bold text-base mb-1">{{title}}</h2>
        <p class="text-sm text-gray-500 mb-1">{{description}}</p>
        <p class="text-sm text-red-500 mb-1">{{instructor.name}}</p>
        <div class="flex items-center gap-0.5 text-red-500 mb-1">
          <span class="font-bold mr-1">{{rating}}</span>
          {{{stars rating}}}
        </div>
        <p class="text-xs text-gray-500 mb-2">{{total_hours}} total hour &bull; {{total_lectures}} lectures &bull; {{level.name}}</p>
        <div class="text-right">
          <span class="font-bold">&#8363; {{price current_price}}</span>
          <span class="ml-2 text-sm text-gray-400 line-through">&#8363; {{price original_price}}</span>
        </div>
      </div>
      <img src="{{image_url}}" alt="{{title}}" class="w-56 h-48 my-auto object-cover shrink-0">
    </div>
    {{/each}}
  </script>

  <!-- Handlebars template: pagination -->
  <script id="tpl-pagination" type="text/x-handlebars-template">
    <div class="flex justify-between items-center mt-2">
      <span class="text-sm text-gray-500">Showing {{start}}-{{end}} of {{total}}</span>
      <div class="flex gap-1">
        <button onclick="goToPage({{prevPage}}); return false;"
          {{#if firstPage}}disabled{{/if}}
          class="px-3 py-1 text-sm border border-gray-300 rounded text-gray-700 hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer">
          Previous
        </button>
        {{#each pages}}
        <button onclick="goToPage({{num}}); return false;"
          class="px-3 py-1 text-sm border rounded cursor-pointer {{#if active}}bg-blue-600 text-white border-blue-600{{else}}border-gray-300 text-gray-700 hover:bg-gray-100{{/if}}">
          {{num}}
        </button>
        {{/each}}
        <button onclick="goToPage({{nextPage}}); return false;"
          {{#if lastPage}}disabled{{/if}}
          class="px-3 py-1 text-sm border border-gray-300 rounded text-gray-700 hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer">
          Next
        </button>
      </div>
    </div>
  </script>

  <script src="vendor/jquery/jquery-3.5.1.min.js"></script>
  <script src="vendor/handlebars/handlebars-v4.7.7.js"></script>
  <script>
    /* ── Handlebars: star rating helper ─────────────────────────────────── */
    Handlebars.registerHelper('stars', function (rating) {
      let full = Math.floor(rating);
      let frac = rating - full;
      let half, empty;
      if (frac >= 0.8) {
        full += 1; half = 0;
      } else if (frac >= 0.3) {
        half = 1;
      } else {
        half = 0;
      }
      empty = 5 - full - half;
      let html = '';
      for (let i = 0; i < full;  i++) html += '<i class="bi bi-star-fill"></i>';
      if (half)                       html += '<i class="bi bi-star-half"></i>';
      for (let j = 0; j < empty; j++) html += '<i class="bi bi-star"></i>';
      return new Handlebars.SafeString(html);
    });

    /* ── Handlebars: price formatter ─────────────────────────────────────── */
    Handlebars.registerHelper('price', function (val) {
      return val.toLocaleString('vi-VN');
    });

    /* ── Compile templates ───────────────────────────────────────────────── */
    let tplCourses    = Handlebars.compile(document.getElementById('tpl-courses').innerHTML);
    let tplPagination = Handlebars.compile(document.getElementById('tpl-pagination').innerHTML);

    /* ── State ───────────────────────────────────────────────────────────── */
    let allCourses  = [];
    let currentPage = 1;
    let PAGE_SIZE   = 5;

    /* ── Render ──────────────────────────────────────────────────────────── */
    function render() {
      let total      = allCourses.length;
      let totalPages = Math.ceil(total / PAGE_SIZE);
      let start      = (currentPage - 1) * PAGE_SIZE;
      let end        = Math.min(start + PAGE_SIZE, total);

      document.getElementById('course-list').innerHTML =
        tplCourses({ courses: allCourses.slice(start, end) });

      let pages = [];
      for (let i = 1; i <= totalPages; i++) {
        pages.push({ num: i, active: i === currentPage });
      }

      document.getElementById('pagination-area').innerHTML =
        tplPagination({
          start:     start + 1,
          end:       end,
          total:     total,
          pages:     pages,
          firstPage: currentPage === 1,
          lastPage:  currentPage === totalPages,
          prevPage:  currentPage - 1,
          nextPage:  currentPage + 1
        });
    }

    window.goToPage = function (page) {
      let totalPages = Math.ceil(allCourses.length / PAGE_SIZE);
      if (page < 1 || page > totalPages) return;
      currentPage = page;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    /* ── Fetch vendor/data.json ──────────────────────────────────────────── */
    fetch('vendor/data.json')
      .then(function (res) { return res.json(); })
      .then(function (data) {
        allCourses = data;
        render();
      })
      .catch(function (err) {
        document.getElementById('course-list').innerHTML =
          '<p class="text-red-500 text-sm">Failed to load courses: ' + err.message + '</p>';
      });

    /* ── Modal open/close ────────────────────────────────────────────────── */
    let modal = document.getElementById('createCourseModal');

    function openModal() {
      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.classList.add('hidden');
      document.body.style.overflow = '';
      document.getElementById('createCourseForm').reset();
    }

    document.getElementById('openModalBtn').addEventListener('click', function (e) {
      e.preventDefault();
      openModal();
    });
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    modal.addEventListener('click', function (e) {
      if (e.target === modal) closeModal();
    });

    /* ── Form validation (browser-native) ───────────────────────────────── */
    document.getElementById('createCourseForm').addEventListener('submit', function (e) {
      e.preventDefault();
      closeModal();
    });
  </script>

</body>
</html>
